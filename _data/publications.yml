- id: worldflow
  title: "WorldFlow: Joint Video and 3D Motion Prediction via Large-Scale Pretraining"
  venue: arXiv preprint, 2026
  description: >-
    WorldFlow predicts how a scene will look and how points in it will move in 3D.
    A single model learns both tasks from 1.44 million object-level samples spanning
    simulated and real-world interactions.
  project_page: https://worldflow-rbs.github.io/
  github: roboscience-ai/worldflow
  arxiv: "2610.39278"
  press_name: 机器之心
  press_url: https://mp.weixin.qq.com/s/nxr34ClHbxqVW3aULfyYVQ
  image: worldflow.webp
  image_alt: Predicted motion trajectories across nine WorldFlow scenes
