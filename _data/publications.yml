- id: layoutdsl
  title: "Learning an Interior Layout Policy in a Domain Specific Language Action Space"
  venue: arXiv preprint, 2026
  description: >-
    LayoutDSL generates furniture layouts as a sequence of design decisions in a
    domain-specific language. The policy learns from annotated rooms and uses
    reinforcement learning to account for physical constraints and interior design principles.
  arxiv: "2608.07547"
  image: layoutdsl.webp
  image_alt: A LayoutDSL furniture plan beside its rendered living room
  authors:
    - luyh
    - weichen_zhang
    - wenyi_xiao
    - haohui_chen
    - yiyun_fei

- id: vlgrasp
  title: "VL-Grasp: a 6-Dof Interactive Grasp Policy for Language-Oriented Objects in Cluttered Indoor Scenes"
  venue: IROS, 2023
  description: "The VL-Grasp is a interactive grasp policy combined with visual grounding and 6-dof grasp pose 
  detection tasks. The robot can adapt to various observation views and more diverse indoor scenes to grasp the 
  target according to a human's language command by applying the VL-Grasp. Meanwhile, we build a new visual 
  grounding dataset specially designed for the robot interaction grasp task, called RoboRefIt."
  project_page: "https://github.com/luyh20/VL-Grasp"
  github: luyh20/VL-Grasp
  arxiv: "2308.00640"
  image: vlgrasp.png
  authors:
    - luyh
    - fyx
    - dbx
    - lff
    - lyl
    - wsj

- id: fgc
  title: "Hybrid Physical Metric For 6-DoF Grasp Pose Detection"
  venue: ICRA, 2022
  description: "We proposed the hybrid physical metric to generate confidence labels for 6-dof grasp poses,
  and designed a transformer-based point cloud learning network, FGC_graspnet, to predict 6-dof grasp poses."
  project_page: "https://github.com/luyh20/FGC-GraspNet"
  github: luyh20/FGC-GraspNet
  arxiv: "2206.11141"
