- id: layoutdsl
  title: "Learning an Interior Layout Policy in a Domain Specific Language Action Space"
  venue: arXiv preprint, 2026
  description: >-
    In LayoutDSL, we represent layout actions in a text-based DSL and post-train an LLM with SFT and RL to generate furniture layouts.
